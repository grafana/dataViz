# The default plugin-validator config of grafana/plugin-ci-workflows ci.yml
# (DEFAULT_PLUGIN_VALIDATOR_CONFIG): turns off analyzers that do not apply to
# Grafana Labs plugins.
global:
  enabled: true

analyzers:
  discoverability:
    enabled: false
  license:
    enabled: false
  org:
    enabled: false
  sponsorshiplink:
    enabled: false
  # Not in the plugin-ci-workflows default. README images link to
  # /public/plugins/<id>/img/... on purpose: absolute URLs do not render on
  # the plugin catalog page. Kept as a warning so new relative links still show.
  brokenlinks:
    rules:
      relative-link:
        severity: warning
