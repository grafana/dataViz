name: Set up plugins workspace
description: Install pnpm and Node (versions from plugins/package.json and plugins/.nvmrc) and the plugins/ workspace dependencies, all of them or one package's. Check out the repo first.

inputs:
  package:
    description: |
      Install only this workspace package and the workspace packages it
      depends on (the workspace root's tools, such as turbo, come along).
      Faster for jobs that build or test a single package. Empty installs
      everything.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # package_json_file is relative to the workspace root; composite steps
    # ignore the caller's defaults.run.working-directory.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: plugins/package.json
    # No `cache:` here: setup-node would save the pnpm store from whichever job
    # finishes first, and a one-package install leaves an incomplete store.
    # The two cache steps below save it only from a full install.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: plugins/.nvmrc

    - name: Find the pnpm store
      id: store
      shell: bash
      working-directory: plugins
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore and save the pnpm store
      if: inputs.package == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('plugins/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Restore the pnpm store
      if: inputs.package != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('plugins/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      working-directory: plugins
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        if [ -z "$PACKAGE" ]; then
          pnpm install --frozen-lockfile --prefer-offline
        else
          # `<package>...` selects the package and its workspace dependencies.
          pnpm install --frozen-lockfile --prefer-offline --filter "$PACKAGE..."
        fi
