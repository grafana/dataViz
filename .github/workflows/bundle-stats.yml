# Bundle-size reporting, one job per plugin (matrix), wrapping the pinned
# grafana/plugin-actions/bundle-size action (see plugins/.github-workflows-reference/bundle-stats.yml).
#
# NOTE ON THE NESTED WORKSPACE: this monorepo's pnpm workspace lives in plugins/,
# but the bundle-size action's "Install dependencies" step runs at the REPO ROOT
# and ignores the working-directory input (only its build/stats step honours it).
# We therefore install the workspace ourselves in plugins/ (mirroring plugin-ci.yml)
# before invoking the action, and keep a tiny root package.json + .npmrc shim so
# the action's own root-level `pnpm install` is a harmless no-op instead of
# failing with ERR_PNPM_NO_PKG_MANIFEST.
name: Bundle Stats

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    name: Discover plugins
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build plugin matrix
        id: set-matrix
        working-directory: plugins/packages/@plugins
        run: |
          matrix=$(for d in */; do
            d="${d%/}"
            [ -f "$d/package.json" ] || continue
            name=$(jq -r .name "$d/package.json")
            echo "{\"name\":\"$name\",\"dir\":\"$d\",\"workdir\":\"plugins/packages/@plugins/$d\"}"
          done | jq -s -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  compare:
    name: bundle-size (${{ matrix.name }})
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: plugins/package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      # Install the real workspace where it actually lives. The bundle-size
      # action's own install step runs at the repo root (see the note at the top
      # of this file), so it can't do this for us.
      - name: Install dependencies
        working-directory: plugins
        run: pnpm install --frozen-lockfile

      - uses: grafana/plugin-actions/bundle-size@bundle-size/v1.0.2
        with:
          working-directory: ${{ matrix.workdir }}
          main-branch-stats-artifact: main-branch-stats-${{ matrix.dir }}
