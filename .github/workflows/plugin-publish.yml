# Publishes grafana-relations-panel to the dev or ops plugin catalog, by hand.
#
# grafana/plugin-ci-workflows' cd.yml does all of it: it builds, tests, signs
# and validates the plugin from its plugin directory, uploads the zip to GCS
# and publishes it with the catalog's publish token. It runs four scripts
# there (lint, typecheck, test:ci, build), which the relations package.json
# passes on to the echarts package. Catalog only: nothing is deployed to
# Grafana Cloud instances. Tags and GitHub releases stay in release-please.yml.
#
# Publishing from main uses the version in plugin.json; any other ref publishes
# <version>+<commit>. The catalog accepts each version once, so publishing main
# again without a version bump fails as a conflict.
name: Publish plugin

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or commit to publish (anything but main gets a +<commit> version suffix)
        default: main
      environment:
        description: Catalog to publish to
        type: choice
        options:
          - dev
          - ops
        default: dev

permissions: {}

jobs:
  publish:
    name: Publish grafana-relations-panel to ${{ inputs.environment }}
    # The permissions cd.yml declares at its top level, which a caller must
    # grant in full (as grafana-canvas-panel does). contents: write is for its
    # GitHub release job, turned off below. A manual run needs write access to
    # this repo already, so the token gives no one more than they have.
    permissions:
      contents: write
      pull-requests: read
      id-token: write # Vault (signing and publish tokens), GCS and IAP logins
      attestations: write # provenance attestation for the zip
    # Pinned to a tag, not a commit SHA, unlike every other uses: here. cd.yml
    # hard-fails when its caller pins it to a hash, and the GCP workload
    # identity that uploads to GCS and reaches the catalog API trusts cd.yml
    # only at main or a semver tag (deployment_tools
    # terraform/modules/gcp_workload_identity_pool/protected-attributes.tf).
    # ci-cd-workflows/v11.3.0 is commit ef2d5f15ea47259e126ed6ea0b63ee3e4c0a73a5.
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v11.3.0 # zizmor: ignore[unpinned-uses]
    with:
      branch: ${{ inputs.branch }}
      plugin-directory: plugins/packages/@plugins/grafana-echarts/src/modules/relations
      environment: ${{ inputs.environment }}
      trigger-argo: false
      disable-github-release: true
      disable-docs-publishing: true
      attestation: true
      # Root CI runs this repo's e2e suites; cd.yml's Playwright setup assumes
      # a single-plugin repo.
      run-playwright: false
      # The validator checks the zip against the plugin directory's source, and
      # src/modules/relations holds only the scripts that delegate to echarts,
      # so it reports non-standard tooling and a source mismatch. Releases
      # validate the same build against the echarts source (release-please.yml).
      run-plugin-validator: false
