# Verifies that extracted i18n markup has been committed, for every package
# that opts into i18n CI.
#
# Revived from grafana-clock-panel's own .github/workflows/i18n-verify.yml,
# which is inert where it lives (GitHub Actions only discovers workflows at the
# repo root). Only thin plumbing lives here — the actual check stays in each
# package's own `i18n-extract:ci` script, so it travels with the package if it
# is ever ejected back out to a standalone repo.
#
# Packages are discovered at run time. Design notes: .github/actions/README.md.
name: i18n verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled, but main is not: cancelling there would
  # leave the merged commit without a completed check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No `paths:` filter, deliberately. A static path glob would be a second source
# of truth that drifts from the discover job's actual rule, and the honest union
# of it (plugins/packages/@plugins/*/**) is broad enough to be equivalent to no
# filter anyway. Discover is a checkout plus one shell step, and `verify` skips
# entirely when nothing is detected.

jobs:
  discover:
    name: Discover i18n packages
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      # Sparse: all this job reads is three files per package. The action
      # below needs no checkout of its own — `$/` is resolved by the runner
      # from this repo at the workflow's ref, not from the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: plugins/packages/@plugins

      - id: find
        uses: $/.github/actions/discover-i18n-packages

  verify:
    name: Verify i18n markup has been committed (${{ matrix.pkg }})
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; nothing here writes back to the repo
    strategy:
      fail-fast: false # one package's failure must not mask another's
      matrix:
        include: ${{ fromJson(needs.discover.outputs.packages) }}
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm action uses the packageManager field in plugins/package.json to
      # understand which version to install. package_json_file is relative
      # to the workspace root, not affected by defaults.run.working-directory.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: plugins/package.json
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: plugins/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # matrix.pkg goes through env rather than being interpolated into the
      # command. It comes from the package.json of the code under test, which on
      # a pull_request is the contributor's, so `${{ }}` here would splice
      # attacker-chosen text into this shell. Nothing is gained today — this job
      # already runs that code via pnpm lifecycle scripts with a read-only token
      # — but it would become exploitable the moment this workflow gains a
      # secret or moves to pull_request_target.
      - name: Verify i18n extraction is up to date
        env:
          PKG: ${{ matrix.pkg }}
        run: pnpm --filter "$PKG" run i18n-extract:ci
