# actionlint config, read by the actionlint workflow and by a local
# `actionlint` run. Without it, actionlint reports an error for every `$/`
# reference, none of which are errors.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # The workflows reference this repo's own actions and reusable workflows
      # as `$/.github/actions/<name>` and `$/.github/workflows/<name>.yml`,
      # GitHub's self-repository syntax. actionlint only recognizes `./`,
      # `docker://` and `{owner}/{repo}@{ref}`, so it reads the `$/` form as a
      # reference with a missing ref. It reports actions and reusable-workflow
      # calls under different messages, hence two patterns.
      #
      # Not a version problem — v1.7.12 is the newest release and its master
      # branch still only special-cases `./` and `docker://`. Tracked upstream
      # as rhysd/actionlint#711, unresolved, and rhysd/actionlint#719 reports
      # the maintainer inactive. Drop this entry once actionlint knows the
      # syntax.
      #
      # The pattern is anchored on `$/`, so a `uses:` that is genuinely missing
      # its ref is still reported (verified: `uses: actions/checkout` still
      # errors). What it does hide is a typo inside a `$/` path — which
      # actionlint cannot check regardless, since it does not resolve the
      # syntax at all.
      #
      # zizmor's self-repository audit enforces the opposite direction — it
      # flags `./` and asks for `$/` — so the two linters disagree and zizmor
      # wins: the workflows use `$/` and this entry silences actionlint.
      - 'specifying action "\$/.+" in invalid format because ref is missing'
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
