# A single Grafana instance that attaches to the shared, aggregated plugin build
# produced by the plugin stack (docker-compose.yaml / `pnpm run plugin`).
#
# Run one instance per Compose project so multiple versions/ports can coexist,
# each sharing the same read-only plugins dir but with its own Grafana data:
#
#   GRAFANA_VERSION=13.1.0 GRAFANA_PORT=3002 pnpm run server
#   GRAFANA_VERSION=12.4.5 GRAFANA_PORT=3003 pnpm run server
services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: ${GRAFANA_CONTAINER_NAME:-grafana-dataviz-${GRAFANA_PORT:-3001}}
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    # Grafana scans plugins only once at startup. If it starts before the plugin
    # build finishes, plugins are marked "not installed" until a restart. Since
    # this stack runs in a separate Compose project it can't use `depends_on` on
    # the plugin build, so gate startup on the aggregated build appearing in the
    # volume: wait for the `.plugin-ids` manifest and every listed plugin's
    # frontend artifacts, then derive the unsigned allow list from the same
    # manifest so no plugin ids are hardcoded here.
    # ($$ escapes $ so Compose passes it through to the shell.)
    entrypoint:
      - sh
      - -c
      - |
        plugins_dir=/var/lib/grafana/plugins
        ids_file="$$plugins_dir/$$IDS_FILE"
        echo "Waiting for aggregated plugin builds in $$plugins_dir ..."
        until [ -s "$$ids_file" ]; do
          sleep 2
        done
        ids=$$(cat "$$ids_file")
        ready=0
        while [ "$$ready" -eq 0 ]; do
          ready=1
          for id in $$(echo "$$ids" | tr ',' ' '); do
            if [ ! -f "$$plugins_dir/$$id/plugin.json" ] || [ ! -f "$$plugins_dir/$$id/module.js" ]; then
              ready=0
            fi
          done
          [ "$$ready" -eq 0 ] && sleep 2
        done
        export GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS="$${GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS:-$$ids}"
        echo "Plugins ready ($$ids). Starting Grafana."
        exec /run.sh
    volumes:
      # Shared, read-only: every Grafana instance reads the same aggregated build
      # (one subdir per plugin id) as its plugins path.
      - plugins-dist:/var/lib/grafana/plugins:ro
      - ./provisioning:/etc/grafana/provisioning
      # Per-instance Grafana data (project-scoped, not shared across instances).
      - workspace-data-grafana:/var/lib/grafana
    environment:
      # Name of the manifest file written by scripts/aggregate-plugins.mjs.
      IDS_FILE: .plugin-ids

      # Grafana settings
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

      # Enable debug logging
      GF_LOG_LEVEL: debug

      # Development mode
      GF_DEFAULT_APP_MODE: development

volumes:
  # Provided by the plugin stack (docker-compose.yaml). Must exist before
  # starting Grafana, i.e. run `pnpm run plugin` first.
  plugins-dist:
    external: true
    name: plugins-dist
  # Project-scoped so each Grafana instance gets its own isolated data.
  workspace-data-grafana:
