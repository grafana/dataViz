packages:
  - "packages/*"
  - "packages/@shared/*"
  - "packages/@plugins/*"
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  # The viz contract (grafana/viz-contract) ships types and JSON only, with no
  # install scripts. The Renderer takes a new contract version on the day it is
  # published, so every version skips the release-age wait. The lockfile still
  # pins the version and its integrity hash.
  - '@grafana/viz-contract'
overrides:
  # grafana-clock-panel pins moment to avoid duplicate versions in its
  # bundle; scoped to that package so it doesn't affect other workspace
  # members that may depend on moment independently.
  '@plugins/grafana-clock-panel>moment': 2.30.1
patchedDependencies:
  # Imported with grafana-echarts; its canvas snapshot tests depend on this
  # patch. pnpm only reads patchedDependencies from the workspace root, so the
  # path is relative to this file, not to the package.
  jest-canvas-mock@2.5.2: packages/@plugins/grafana-echarts/patches/jest-canvas-mock@2.5.2.patch
