apiVersion: 1

# Loads any dashboard JSON under this folder. Subdirectories become Grafana
# folders when foldersFromFilesStructure is true (e.g. echarts/* → "echarts").
# Workspace demo: grafana-workspace-panel with TestData DB.
# ECharts examples: copied from grafana-echarts-panel provisioning.
providers:
  - name: Workspace
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
