apiVersion: 1

# Loads any dashboard JSON in this folder. The example dashboards render the
# migrated plugins (grafana-workspace-panel, marcusolsson-dynamictext-panel)
# against TestData DB, so `pnpm run server` shows the panels with data
# immediately.
providers:
  - name: Workspace
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
