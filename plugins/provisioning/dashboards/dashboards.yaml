apiVersion: 1

# Loads any dashboard JSON in this folder. The example dashboards render the
# migrated panel plugins (grafana-workspace-panel, grafana-canvas-panel) with
# TestData DB, so `pnpm run server` shows the panels with data immediately.
providers:
  - name: dataViz plugins
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
